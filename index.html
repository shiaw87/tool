<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>頁匠工具箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 版面：左側工具欄 + 右側工作區；工作區為「檔案／預覽」與「設定／輸出」兩欄 */
:root{
  --bg:#eef0f4; --surface:#ffffff; --sunken:#e3e6ed; --ink:#161b26; --muted:#5c6475;
  --line:#cfd4de; --accent:#1f47c8; --accent-ink:#ffffff; --accent-soft:#dfe6fb;
  --ok:#17794a; --warn:#9a5b00; --bad:#b3261e;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-display:"Noto Serif TC","Songti TC",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151c; --surface:#1b1f29; --sunken:#0d1016; --ink:#e8ebf2; --muted:#98a1b3;
    --line:#333a49; --accent:#8fa8ff; --accent-ink:#0c1230; --accent-soft:#232c4d;
    --ok:#5fcf97; --warn:#e6b25a; --bad:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b1f29; --sunken:#0d1016; --ink:#e8ebf2; --muted:#98a1b3;
  --line:#333a49; --accent:#8fa8ff; --accent-ink:#0c1230; --accent-soft:#232c4d;
  --ok:#5fcf97; --warn:#e6b25a; --bad:#ff8a80; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--font-body);display:flex}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
aside{width:232px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
.brand{padding:18px 18px 12px;font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.04em}
.brand small{display:block;font:400 12px var(--font-body);color:var(--muted);letter-spacing:0;margin-top:2px}
nav{display:flex;flex-direction:column;gap:2px;padding:4px 10px 14px}
nav .grp{font-size:11px;color:var(--muted);padding:12px 8px 4px;letter-spacing:.08em}
nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;display:block}
nav button:hover{background:var(--sunken)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
nav button:focus-visible{outline:2px solid var(--accent)}
.note{margin-top:auto;padding:12px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
main{flex:1;min-width:0;overflow:auto;padding:22px 24px 40px}
h1{font:700 22px var(--font-display);margin:0 0 2px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:65ch}
.tool{display:none}.tool.on{display:block}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h2{font:700 13px var(--font-body);margin:0 0 10px;letter-spacing:.04em}
.side{display:flex;flex-direction:column;gap:14px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px 14px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop b{color:var(--ink);display:block;font-size:15px}
.files{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.files .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.files .sz,.num{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.filebar li{cursor:grab}.filebar li.dragover{border-style:dashed;border-color:var(--accent);background:var(--accent-soft)}
.grip{color:var(--muted);font-size:16px;line-height:1}
.tag{font-size:11px;border-radius:99px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.pri:hover{filter:brightness(1.1);color:var(--accent-ink)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field>span{font-size:12px;color:var(--muted)}
.field input[type=text],.field input[type=password],.field input[type=number],.field input[type=datetime-local],.field select,.field textarea{
  border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.status{font-size:13px;min-height:20px;margin-top:8px;overflow-wrap:anywhere}
.status.ok{color:var(--ok)}.status.err{color:var(--bad)}.status.busy{color:var(--warn)}
.results{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.results li{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.results .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.warnbox{font-size:12px;color:var(--warn);border-left:3px solid var(--warn);padding:2px 8px;margin:8px 0}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.pg{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;user-select:none}
.pg.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pg.dragover{border-style:dashed;border-color:var(--accent)}
.pg .th{height:150px;display:flex;align-items:center;justify-content:center;background:var(--sunken);border-radius:5px;overflow:hidden}
.pg canvas,.pg .blank{max-width:100%;max-height:140px;background:#fff;box-shadow:0 0 0 1px var(--line);transition:transform .15s}
.pg .blank{width:96px;height:136px}
.pg .cap{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.pg .cap span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg .acts{display:flex;gap:2px;justify-content:space-between}
.pg .acts button{all:unset;cursor:pointer;font-size:13px;width:22px;height:22px;text-align:center;border-radius:4px}
.pg .acts button:hover{background:var(--accent-soft);color:var(--accent)}
.pg .acts button:focus-visible{outline:2px solid var(--accent)}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sigprev{max-width:100%;max-height:70px;background:#fff;border:1px solid var(--line);border-radius:6px;display:block;margin:6px 0}
main.full{padding:0;overflow:hidden}
.tool.full.on{display:flex;height:100%}
.boardhost{flex:1;min-width:0;min-height:0}
.cards{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cardhead{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.cardhead .nm{flex:1;min-width:160px;overflow-wrap:anywhere}
.cardhead .nm .tag{margin-left:8px}
.pv{background:var(--sunken);padding:14px;text-align:center;max-height:560px;overflow:auto}
.pv.chk{background:repeating-conic-gradient(#d5d8e0 0 25%,#fff 0 50%) 0 0/20px 20px}
.pv img{max-width:100%;box-shadow:0 0 0 1px var(--line)}
.editor{margin-top:12px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:320px}
.split .code{border:1px solid var(--line);background:var(--sunken);border-radius:8px;padding:10px;resize:none;width:100%;height:100%;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto;tab-size:2}
.livepv{border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;max-height:none;height:100%;padding:10px}
.livepv img{max-height:100%;object-fit:contain}
.hint.bad{color:var(--bad)}
@media (max-width:700px){.split{grid-template-columns:1fr;height:auto}.split .code{height:200px}.livepv{height:220px}}
@media (max-width:900px){
  main.full{overflow:visible}.tool.full.on{height:82vh;min-height:520px}
  body{flex-direction:column}
  aside{width:auto;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  nav{flex-direction:row;flex-wrap:wrap}.note{display:none} nav .grp{width:100%;padding-top:6px}
  main{overflow:visible;padding:16px}
  .cols{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){.pg canvas{transition:none}}
</style>
</head>
<body>
<aside>
  <div class="brand">頁匠<small>本機處理的文件與圖片工具箱</small></div>
  <nav id="nav" aria-label="工具"></nav>
  <div class="note">檔案只在這個瀏覽器分頁內處理，不會上傳。</div>
</aside>
<main id="main"></main>
<script src="./vendor/pdf-lib.min.js"></script>
<script src="./vendor/jszip.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
